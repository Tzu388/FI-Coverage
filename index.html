const getHealth = (ds) => { const d = daysSince(ds); return d >= 45 ? "stale" : d >= 20 ? "drifting" : "fresh"; };
const fmtDate   = (ds) => { if (!ds) return "—"; return new Date(ds).toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"2-digit" }); };

// ─── useMobile hook ───────────────────────────────────────────────────────────
function useMobile() {
  const [isMobile, setIsMobile] = useState(window.innerWidth < 640);
  useEffect(() => {
    const h = () => setIsMobile(window.innerWidth < 640);
    window.addEventListener("resize", h);
    return () => window.removeEventListener("resize", h);
  }, []);
  return isMobile;
}

function resolveClientId(name, clients) {
  if (!name) return null;
  const lower = name.toLowerCase().trim();
  if (ALIASES[lower]) return ALIASES[lower];
  const exact = clients.find(c => c.name.toLowerCase() === lower);

  const partial = clients.find(c => c.name.toLowerCase().startsWith(lower) || lower.startsWith(c.id));
  return partial ? partial.id : null;
}

function generatePrompt(routineId, client, fields, clients) {
  const stale    = clients.filter(c => daysSince(c.l2Updated) >= 45).map(c => c.name).join(", ") || "None";
  const drifting = clients.filter(c => { const d = daysSince(c.l2Updated); return d >= 20 && d < 45; }).map(c => c.name).join(", ") || "None";
  const TF = `Format: OUTREACH TRIGGER — [Institution] — [Role] — [Action: one sentence starting with a verb] — [Timeframe] — [Status: OPEN]`;

  if (routineId === "morning-scan") return `STALENESS CHECK [${TODAY_STR}]\nSTALE: ${stale}\nDRIFTING: ${drifting}\n\n───\n\nSearch: MAS · SGX · BNM · BoJ · Fed · ECB · Basel · FCA · FINMA announcements today. DBS OR "OCBC" OR "Bank of Singapore" OR UOB. JPMorgan Asia OR Citi OR HSBC Asia OR StanChart. UBS Asia OR Julius Baer OR Barclays Asia OR UBP. Maybank OR CIMB OR Nomura Asia. Asia derivative clearing · custody · DCM/ECM/M&A FI · structured products · Singapore capital markets.\n\n🔴 TIER 1 ALERTS — action or outreach today\nInstitution → What changed → Why it matters → Action + role → Competitive position → Product\nFor each requiring outreach:\n${TF}\n\n🟡 TIER 2 WATCH ITEMS\nInstitution → Signal → Implication → Time horizon\n\n🌐 MACRO & REGULATORY BACKDROP\nSegment-specific implications only (Tier 1A / 1B / 2). Skip segments with nothing material.\n\n❓ NOTABLE ABSENCES\n\n🔄 CONTRARIAN READ (3 lines max)\n\n📊 CONFIDENCE\nConfirmed · Inferred · Speculative — three lines, names and facts only.`;

  if (routineId === "weekly-thesis") return `LAYER 2 HEALTH CHECK [${TODAY_STR}]\nSTALE: ${stale}\nDRIFTING: ${drifting}\n\nSignals this week:\n[PASTE]\n\n───\n\nLENS 1 — TIER 1A: DBS · OCBC Group · UOB · UOB Kay Hian\n- Dominant strategic theme? [A]\n- Which client most exposed/advantaged and why? [A]\n- Top growth product opportunity: product · institution · incumbent/challenger [C]\n- What to lead with next week? [C]\n\nLENS 2 — TIER 1B: JPM · Citi · Barclays · HSBC · StanChart · UBS · Julius Baer · UBP\n- Global parent developments with Singapore implications? [A]\n- Which client is at an inflection point and why now? [A]\n- Top growth product opportunity [C]\n\nLENS 3 — TIER 2: Maybank · CIMB · Nomura\n- ASEAN macro/regulatory development most affecting Tier 2? [A]\n- Cross-border theme connecting Tier 2 to Tier 1? [A]\n- Emerging product opportunity? [C]\n\nSYNTHESIS\n- Single most important theme connecting all segments? [A]\n- Contrarian read — not already named above [A]\n- One thing to do differently next week [C]\nFor each outreach action:\n${TF}\n\nCONFIDENCE — three lines, label + names/facts, max 20 words each.`;

  if (routineId === "meeting-prep" && client) {
    const d = daysSince(client.l2Updated), h = getHealth(client.l2Updated);
    const sn = h==="stale"?`⚠ Layer 2 STALE (${d}d) — flag outdated intelligence.`:h==="drifting"?`⚠ Layer 2 DRIFTING (${d}d).`:`✓ Layer 2 current (${d}d).`;
    return `Institution: ${client.name} (Tier ${client.tier})\nRole: ${fields.role||"[specify]"}\nContext: ${fields.context||"[specify]"}\nAgenda: ${fields.agenda||"[specify or: unclear]"}\nSignals: ${fields.signals||"none"}\n${sn}\n\nUsing the Coverage Intelligence File Layer 2 brief for ${client.name}, generate my meeting prep. Each section: 3 lines max.\n\nCLIENT STRATEGIC MOMENT\nSTAKEHOLDER LENS\nRECOMMENDED CONVERSATION THEMES (3 max) — theme · opening · good response · deflection signal\nGROWTH PRODUCT ANGLE — product · entry point · competitive position · angle\nWHAT TO AVOID\nOBJECTIONS TO PREPARE FOR (2)\nDESIRED OUTCOMES — 1. Best case 2. Acceptable 3. Minimum useful\nOUTREACH TRIGGER\n${TF}\nCONFIDENCE — three lines.`;
  }

  if (routineId === "post-call" && client) return `Institution: ${client.name} (Tier ${client.tier})\nRoles present: ${fields.roles||"[specify]"}\nMeeting type: ${fields.meetingType||"[specify]"}\nDate: ${fields.date||TODAY_STR}\n\nRaw notes:\n[PASTE]\n\nWHAT WAS SAID — Said / Asked / Committed (max 3 bullets each)\nWHAT WAS NOT SAID — avoided topics (max 3)\nLAYER 2 BRIEF UPDATE — changed fields only, tag [C]/[I]/[S]\nCRM-READY SUMMARY — one paragraph, max 5 sentences\nCOMMITTED NEXT STEPS\nOUTREACH TRIGGER\n${TF}`;

  if (routineId === "earnings" && client) return `EARNINGS DEEP-DIVE: ${client.name} (Tier ${client.tier})\n\n[PASTE SOURCE MATERIAL]\n\nWHAT MANAGEMENT EMPHASISED\nWHAT MANAGEMENT AVOIDED OR DEFLECTED\nPRODUCT IMPLICATIONS (2 lines each): Structured products · Custody & collateral · DCM/ECM/M&A · Derivative clearing\nOUTREACH TRIGGERED (1–2 only)\n${TF}\nLAYER 2 BRIEF UPDATE\nCOMPETITIVE READ\nWHAT TO WATCH NEXT QUARTER (2–3 observable datapoints)\nCONFIDENCE — three lines.`;

  if (routineId === "l2-refresh" && client) return `LAYER 2 REFRESH: ${client.name} (Tier ${client.tier})\nLast updated: ${daysSince(client.l2Updated)} days ago\nProducts: SP=${client.products.structured} CU=${client.products.custody} DCM=${client.products.dcm} CL=${client.products.clearing}\n\nStep 1 — Search: "${client.name}" news/leadership/strategy/earnings last 60 days.\n\nStep 2 — Output exactly:\nIMPORTANT: Use exactly this name on L2:CLIENT line: ${client.name}\n\nL2_START\nL2:CLIENT:${client.name}\nL2:STRATEGIC_MOMENT:[2–3 sentences]\nL2:RECENT_SIGNALS:[· signal one\\n· signal two]\nL2:PRODUCT_SP:[unknown/warm/active/cold]\nL2:PRODUCT_CU:[unknown/warm/active/cold]\nL2:PRODUCT_DCM:[unknown/warm/active/cold]\nL2:PRODUCT_CL:[unknown/warm/active/cold]\nL2:NEXT_ACTION:[verb-first sentence]\nL2:WATCH_1:[item]\nL2:WATCH_2:[item]\nL2:WATCH_3:[item or leave empty]\nL2_END`;

  return "";
}

function HealthPill({ status }) {
  const labels = { stale:"STALE", drifting:"DRIFT", fresh:"FRESH" };
  return <span style={pill(H_COL[status],H_BG[status],H_BDR[status])}>{labels[status]}</span>;
}

function ProductDots({ products, small }) {
  return (
    <div style={{ display:"flex", gap:small?4:6, alignItems:"center" }}>
      {Object.entries(products).map(([k,v]) => {
        const col = v==="active"?C.emL:v==="warm"?C.gold:C.txt3, filled = v==="active"||v==="warm";

          <div style={{ width:small?7:8,height:small?7:8,borderRadius:"50%",background:filled?col:"transparent",border:`1.5px solid ${col}` }}/>

        </div>;

}

function EvTag({ type }) {

}

function Divider() { return <div style={{ borderTop:`0.5px solid ${C.bdr}`, margin:"14px 0" }}/>; }

function StatCard({ label, val, col, bg }) {

function LaunchView({ clients,setClients,selRoutine,setSelRoutine,selClientId,setSelClientId,fields,setFields,setActivityLog,setOutreach }) {
  const mob = useMobile();
  const px  = mob ? "14px 14px" : "28px 22px";
  const [prompt,setPrompt]         = useState("");
  const [copied,setCopied]         = useState(false);
  const [captureText,setCaptureText] = useState("");
  const [captured,setCaptured]     = useState(null);

  useEffect(()=>{ if(!selRoutine){setPrompt("");return;} setPrompt(generatePrompt(selRoutine,clients.find(c=>c.id===selClientId),fields,clients)); },[selRoutine,selClientId,fields,clients]);

  const copy = () => {
    if(!prompt) return;
    try{const ta=document.createElement("textarea");ta.value=prompt;ta.style.cssText="position:fixed;top:-9999px;left:-9999px;opacity:0";document.body.appendChild(ta);ta.focus();ta.select();const ok=document.execCommand("copy");document.body.removeChild(ta);if(!ok)throw new Error();setCopied(true);setTimeout(()=>setCopied(false),2200);}
    catch{navigator.clipboard.writeText(prompt).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2200);}).catch(()=>{});}
  };

  const logRun = () => { if(!selRoutine)return; const client=clients.find(c=>c.id===selClientId); setActivityLog(prev=>[{id:Date.now().toString(),date:TODAY_STR,routine:selRoutine,clientId:selClientId||null,clientName:client?.name||null,findings:""},...prev]); };

  const parseCapture = () => {
    let triggerCount=0, l2ClientName=null;
    const triggers=(captureText.match(/OUTREACH TRIGGER[^\n]*/gi)||[]).map(line=>{
      const p=line.replace(/^OUTREACH TRIGGER\s*[-—]\s*/i,"").split(/\s*[-—]\s*/);
      const isNew=p.length>=4, institution=isNew?(p[0]?.trim()||""):"";
      const resolvedId=resolveClientId(institution,clients);
      return {id:Date.now().toString()+Math.random(),institution,role:isNew?(p[1]?.trim()||""):(p[0]?.trim()||""),action:isNew?(p[2]?.trim()||""):(p[1]?.trim()||""),due:isNew?(p[3]?.trim()||""):(p[2]?.trim()||""),status:"open",clientId:resolvedId||selClientId||"",source:`${selRoutine} ${TODAY_STR}`,created:TODAY_STR,outcome:""};
    });
    if(triggers.length){setOutreach(prev=>[...triggers,...prev]);triggerCount=triggers.length;}
    const l2Match=captureText.match(/L2_START([\s\S]*?)L2_END/i);
    if(l2Match){
      const block=l2Match[1];
      const getF=key=>{const m=block.match(new RegExp(`L2:${key}:([^\\n]*)`));return m?m[1].trim():null;};
      const matched=clients.find(c=>c.id===resolveClientId(getF("CLIENT"),clients));
      if(matched){
        l2ClientName=matched.name;
        const sp=getF("PRODUCT_SP"),cu=getF("PRODUCT_CU"),dcm=getF("PRODUCT_DCM"),cl=getF("PRODUCT_CL");
        const newWI=[getF("WATCH_1"),getF("WATCH_2"),getF("WATCH_3")].filter(Boolean);
        setClients(prev=>prev.map(c=>c.id!==matched.id?c:{...c,strategicMoment:getF("STRATEGIC_MOMENT")||c.strategicMoment,recentSignals:getF("RECENT_SIGNALS")||c.recentSignals,nextAction:getF("NEXT_ACTION")||c.nextAction,watchItems:newWI.length>0?newWI:c.watchItems,products:{structured:sp||c.products.structured,custody:cu||c.products.custody,dcm:dcm||c.products.dcm,clearing:cl||c.products.clearing},l2Updated:TODAY_STR}));
      }
    }
    setCaptured({triggerCount,l2ClientName});
  };

  const routine   = ROUTINES.find(r=>r.id===selRoutine);
  const selClient = clients.find(c=>c.id===selClientId);
  const fieldDefs = {
    "meeting-prep":[{key:"role",lbl:"Stakeholder role",ph:"e.g. Head of Markets Singapore"},{key:"context",lbl:"Meeting context",ph:"e.g. Quarterly relationship review"},{key:"agenda",lbl:"Likely agenda",ph:"e.g. Unclear / clearing discussion"},{key:"signals",lbl:"Signals to factor in",ph:"From morning scan, or: none"}],
    "post-call":[{key:"roles",lbl:"Roles present",ph:"e.g. Group Treasurer, Head of Markets"},{key:"meetingType",lbl:"Meeting type",ph:"e.g. Relationship review"},{key:"date",lbl:"Date",ph:TODAY_STR,type:"date"}],
  };

  return (
    <div style={{ padding:px, maxWidth:880, margin:"0 auto" }}>
      <div style={{ fontFamily:serif,fontSize:mob?20:22,color:C.txt,marginBottom:4,fontWeight:400 }}>Routine Launcher</div>
      <div style={{ fontFamily:mono,fontSize:9,color:C.txt3,marginBottom:20,letterSpacing:"0.07em" }}>SELECT → CONFIGURE → COPY → PASTE INTO CLAUDE PROJECT</div>

      {/* Routine selector — single column on mobile */}
      <div style={{ marginBottom:16 }}>
        <span style={labelSt}>Step 1 — Select routine</span>
        <div style={{ display:"grid", gridTemplateColumns:mob?"1fr":"1fr 1fr", gap:9 }}>
          {ROUTINES.map(r=>(
            <button key={r.id} onClick={()=>{setSelRoutine(r.id);setFields({});}}
              style={{ background:selRoutine===r.id?C.surf3:"none",border:`0.5px solid ${selRoutine===r.id?C.gold:C.bdr}`,borderRadius:8,padding:mob?"13px 14px":"12px 14px",cursor:"pointer",textAlign:"left",color:C.txt,minHeight:mob?54:undefined }}>
              <div style={{ fontSize:13,fontWeight:600,color:selRoutine===r.id?C.gold:C.txt,marginBottom:3 }}>{r.label}</div>
              <div style={{ fontSize:11,color:C.txt3,fontFamily:mono }}>{r.sub}</div>
            </button>
          ))}
        </div>
      </div>

      {selRoutine&&<div style={{ ...cardSt,marginBottom:14 }}>
        <span style={labelSt}>Step 2 — Configure</span>
        {routine?.needsClient&&<div style={{ marginBottom:14 }}>
          <div style={{ fontSize:12,color:C.txt2,marginBottom:6 }}>Client</div>
          <div style={{ display:"flex",flexDirection:mob?"column":"row",alignItems:mob?"stretch":"center",gap:10 }}>
            <select value={selClientId} onChange={e=>setSelClientId(e.target.value)} style={{ ...inputSt,width:"100%",maxWidth:mob?"100%":280 }}>
              <option value="">Select client</option>
              {["1A","1B","2"].map(t=><optgroup key={t} label={`Tier ${t}`}>{clients.filter(c=>c.tier===t).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</optgroup>)}
            </select>
            {selClient&&<span style={{ fontFamily:mono,fontSize:11,color:H_COL[getHealth(selClient.l2Updated)] }}>L2 {getHealth(selClient.l2Updated).toUpperCase()} · {daysSince(selClient.l2Updated)}d</span>}
          </div>
        </div>}
        {fieldDefs[selRoutine]
          ?<div style={{ display:"grid",gridTemplateColumns:"1fr",gap:12 }}>
              {fieldDefs[selRoutine].map(f=><div key={f.key}><div style={{ fontSize:12,color:C.txt2,marginBottom:5 }}>{f.lbl}</div><input style={inputSt} type={f.type||"text"} placeholder={f.ph} value={fields[f.key]||""} onChange={e=>setFields(p=>({...p,[f.key]:e.target.value}))}/></div>)}
            </div>
          :<div style={{ fontSize:12,color:C.txt3,fontFamily:mono,lineHeight:1.75 }}>{routine?.desc||""}</div>}
      </div>}

      {prompt&&<div style={{ marginBottom:14 }}>
        <div style={{ display:"flex",flexDirection:mob?"column":"row",justifyContent:"space-between",alignItems:mob?"stretch":"center",marginBottom:8,gap:8 }}>
          <span style={labelSt}>Step 3 — Copy → paste into Claude Project</span>
          <div style={{ display:"flex",gap:8 }}>
            <button onClick={copy} style={{ ...mkBtn(copied?C.emL:C.txt,C.surf3,copied?`${C.emL}44`:C.bdr2,mob),fontFamily:mono,fontSize:12,padding:mob?"11px 16px":"5px 14px",flex:mob?1:undefined }}>
              {copied?"✓ Copied":"Copy prompt"}
            </button>
            <button onClick={logRun} style={{ ...mkBtn(C.txt2,"none",C.bdr,mob),fontFamily:mono,fontSize:12,padding:mob?"11px 14px":"5px 12px" }}>Log</button>
          </div>
        </div>
        {selRoutine==="earnings"&&<div style={{ background:C.burgD,border:`0.5px solid ${C.burgL}44`,borderRadius:6,padding:"10px 14px",marginBottom:10,fontFamily:mono,fontSize:11,color:C.burgL,lineHeight:1.75 }}>⚠ Always run earnings deep-dives in a fresh Claude Project chat.</div>}
        <textarea readOnly value={prompt} rows={mob?10:13} style={{ ...inputSt,resize:"vertical",fontFamily:mono,fontSize:11,lineHeight:1.85,background:C.surf,cursor:"default",color:C.txt2 }}/>
      </div>}

      {selRoutine&&<div style={cardSt}>
        <span style={labelSt}>Output capture</span>
        <div style={{ fontSize:12,color:C.txt3,marginBottom:12,lineHeight:1.75 }}>Paste Claude's output to extract <span style={{ fontFamily:mono,color:C.gold,fontSize:10 }}>OUTREACH TRIGGER —</span> lines and parse <span style={{ fontFamily:mono,color:C.sapL,fontSize:10 }}>L2_START...L2_END</span> blocks.</div>
        <textarea placeholder="Paste Claude's output here..." value={captureText} onChange={e=>{setCaptureText(e.target.value);setCaptured(null);}} rows={mob?6:5} style={{ ...inputSt,resize:"vertical",fontFamily:mono,fontSize:11,lineHeight:1.75,marginBottom:12 }}/>
        <div style={{ display:"flex",flexDirection:mob?"column":"row",alignItems:mob?"stretch":"center",gap:10 }}>
          <button onClick={parseCapture} style={{ ...mkBtn(C.txt,C.surf3,C.bdr2,mob),fontSize:12,padding:mob?"11px 16px":"5px 14px" }}>Extract</button>
          {captured&&<div style={{ display:"flex",flexDirection:"column",gap:4 }}>
            {captured.triggerCount>0?<span style={{ fontFamily:mono,fontSize:11,color:C.emL }}>✓ {captured.triggerCount} trigger{captured.triggerCount>1?"s":""} added</span>:<span style={{ fontFamily:mono,fontSize:11,color:C.txt3 }}>No OUTREACH TRIGGER lines found</span>}
            {captured.l2ClientName?<span style={{ fontFamily:mono,fontSize:11,color:C.sapL }}>✓ Layer 2 updated — {captured.l2ClientName}</span>:selRoutine==="l2-refresh"&&<span style={{ fontFamily:mono,fontSize:11,color:C.txt3 }}>No L2_START block found</span>}
          </div>}
        </div>
      </div>}
    </div>
  );
}

function PipelineView({ clients, outreach, setOutreach }) {
  const mob = useMobile();
  const px  = mob ? "14px 14px" : "28px 22px";
  const [showClosed, setShowClosed] = useState(false);
  const [form, setForm] = useState({institution:"",clientId:"",role:"",action:"",due:"",source:""});

  const addTrigger = () => {
    if(!form.role||!form.action) return;
    const mc = form.clientId?clients.find(c=>c.id===form.clientId):null;
    setOutreach(prev=>[{id:Date.now().toString(),...form,institution:form.institution||mc?.name||"",status:"open",created:TODAY_STR,outcome:""},...prev]);
    setForm({institution:"",clientId:"",role:"",action:"",due:"",source:""});
  };
  const updStatus    = (id,status) => setOutreach(prev=>prev.map(t=>t.id===id?{...t,status}:t));
  const deleteTrigger= (id)        => setOutreach(prev=>prev.filter(t=>t.id!==id));

  const openC   = outreach.filter(t=>t.status==="open").length;
  const inProgC = outreach.filter(t=>t.status==="in_progress").length;
  const closedC = outreach.filter(t=>t.status==="closed"||t.status==="abandoned").length;
  const visible = outreach.filter(t=>showClosed?true:t.status==="open"||t.status==="in_progress");

  return (
    <div style={{ padding:px, maxWidth:880, margin:"0 auto" }}>
      <div style={{ fontFamily:serif,fontSize:mob?20:22,color:C.txt,marginBottom:4,fontWeight:400 }}>Outreach Pipeline</div>
      <div style={{ fontFamily:mono,fontSize:9,color:C.txt3,marginBottom:18,letterSpacing:"0.07em" }}>{openC} OPEN · {inProgC} IN PROGRESS · {closedC} CLOSED</div>

      {/* Add trigger form — single column on mobile */}
      <div style={cardSt}>
        <span style={labelSt}>Add trigger manually</span>
        <div style={{ display:"grid", gridTemplateColumns:"1fr", gap:10, marginBottom:12 }}>
          {[
            {key:"clientId",lbl:"Client",type:"sel"},
            {key:"role",    lbl:"Role to contact",ph:"e.g. Head of Markets Singapore"},
            {key:"action",  lbl:"Action — what to do and open with",ph:"Request meeting: lead with TLAC consultation as DCM entry point"},
            {key:"due",     lbl:"Due by",type:"date"},
            {key:"source",  lbl:"Source",ph:"e.g. Morning scan 19 May"},
          ].map(f=>(
            <div key={f.key}>
              <div style={{ fontSize:12,color:C.txt2,marginBottom:5 }}>{f.lbl}</div>
              {f.type==="sel"
                ?<select value={form[f.key]} onChange={e=>{const c=clients.find(cl=>cl.id===e.target.value);setForm(p=>({...p,clientId:e.target.value,institution:c?.name||p.institution}));}} style={inputSt}><option value="">Select client</option>{clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>
                :<input type={f.type||"text"} style={inputSt} placeholder={f.ph||""} value={form[f.key]} onChange={e=>setForm(p=>({...p,[f.key]:e.target.value}))}/>}
            </div>
          ))}
        </div>
        <button onClick={addTrigger} style={{ ...mkBtn(C.txt,C.surf3,C.bdr2,mob),width:"100%",padding:mob?"12px":"9px",fontSize:13 }}>Add trigger</button>
      </div>

      <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12 }}>
        <span style={labelSt}>Active triggers</span>
        <button onClick={()=>setShowClosed(!showClosed)} style={{ background:"none",border:"none",cursor:"pointer",fontFamily:mono,fontSize:11,color:C.txt3,minHeight:44,padding:"0 4px" }}>
          {showClosed?"↑ Hide closed":"↓ Show closed"}
        </button>
      </div>

      {visible.length===0
        ?<div style={{ color:C.txt3,fontFamily:mono,fontSize:12,padding:"26px 0",lineHeight:2.2 }}>No active triggers. Use output capture on the Launch tab, or add manually above.</div>
        :visible.map(t=>{
          const cm  = clients.find(c=>c.id===t.clientId), di=t.institution||cm?.name||"—";
          const du  = t.due?daysUntil(t.due):null, ov=du!==null&&du<0;
          const closed = t.status==="closed"||t.status==="abandoned";
          const lcol   = ov?C.burgL:closed?C.txt3:t.status==="in_progress"?C.sapL:C.bdr2;

          return (
            <div key={t.id} style={{ ...cardSt,borderLeft:`2px solid ${lcol}`,opacity:closed?0.5:1,marginBottom:10 }}>
              {/* Trigger body — text always on top */}
              <div style={{ marginBottom:12 }}>
                <div style={{ display:"flex",gap:7,alignItems:"center",marginBottom:6,flexWrap:"wrap" }}>
                  <span style={{ fontFamily:mono,fontSize:mob?12:11,color:C.gold,fontWeight:700,letterSpacing:"0.05em" }}>{di}</span>
                  <span style={{ color:C.txt3,fontSize:10 }}>·</span>
                  <span style={{ fontSize:mob?13:12,color:C.txt,fontWeight:500 }}>{t.role}</span>
                  {ov&&<span style={pill(C.burgL,C.burgD,`${C.burgL}44`)}>OVERDUE</span>}
                  {t.status==="in_progress"&&<span style={pill(C.sapL,C.sapD,`${C.sapL}44`)}>IN PROGRESS</span>}
                  {t.status==="closed"&&<span style={pill(C.emL,C.emD,`${C.emL}44`)}>CLOSED</span>}
                  {t.status==="abandoned"&&<span style={pill(C.txt3,"transparent",C.bdr)}>DROPPED</span>}
                </div>
                <div style={{ fontSize:mob?13:12,color:C.txt2,marginBottom:8,lineHeight:1.6 }}>{t.action}</div>
                <div style={{ display:"flex",gap:14,fontFamily:mono,fontSize:10,color:C.txt3,flexWrap:"wrap" }}>
                  {t.due&&<span>Due: {fmtDate(t.due)}{du!==null?` (${ov?`${Math.abs(du)}d overdue`:`${du}d`})`:""}</span>}
                  {t.source&&<span>Via: {t.source}</span>}
                </div>
              </div>

              {/* Action buttons — always below text, fill width on mobile */}
              <div style={{ display:"flex",gap:8,flexWrap:"wrap",paddingTop:10,borderTop:`0.5px solid ${C.bdr}` }}>
                {!closed&&<>
                  {t.status==="open"&&
                    <button onClick={()=>updStatus(t.id,"in_progress")} style={{ ...mkBtn(C.sapL,"none",`${C.sapL}44`,mob),fontSize:mob?13:11,padding:mob?"10px 14px":"5px 11px",fontFamily:mono,flex:mob?"1":undefined }}>Working</button>}
                  <button onClick={()=>updStatus(t.id,"closed")} style={{ ...mkBtn(C.emL,"none",`${C.emL}44`,mob),fontSize:mob?13:11,padding:mob?"10px 14px":"5px 11px",fontFamily:mono,flex:mob?"1":undefined }}>Close</button>
                  <button onClick={()=>updStatus(t.id,"abandoned")} style={{ ...mkBtn(C.txt3,"none",C.bdr,mob),fontSize:mob?13:11,padding:mob?"10px 14px":"5px 11px",fontFamily:mono,flex:mob?"1":undefined }}>Drop</button>
                </>}
                <div style={{ flex:mob&&!closed?"1":undefined }}>
                  <DeleteButton onConfirm={()=>deleteTrigger(t.id)} mob={mob}/>
                </div>
              </div>
            </div>
          );
        })}
    </div>
  );
}

function LogView({ clients, activityLog, setActivityLog }) {
  const mob = useMobile();
  const px  = mob ? "14px 14px" : "28px 22px";
  const [form, setForm] = useState({clientId:"",routine:"",findings:""});
  const add = () => {
    if(!form.routine) return;
    const client=clients.find(c=>c.id===form.clientId);
    setActivityLog(prev=>[{id:Date.now().toString(),date:TODAY_STR,...form,clientName:client?.name||null},...prev]);
    setForm({clientId:"",routine:"",findings:""});

  return (
    <div style={{ padding:px, maxWidth:880, margin:"0 auto" }}>
      <div style={{ fontFamily:serif,fontSize:mob?20:22,color:C.txt,marginBottom:4,fontWeight:400 }}>Activity Log</div>
      <div style={{ fontFamily:mono,fontSize:9,color:C.txt3,marginBottom:18,letterSpacing:"0.07em" }}>{activityLog.length} ENTRIES</div>

      <div style={cardSt}>
        <span style={labelSt}>Quick log entry</span>
        {/* Single column on mobile */}
        <div style={{ display:"grid",gridTemplateColumns:"1fr",gap:10,marginBottom:12 }}>
          <div>
            <div style={{ fontSize:12,color:C.txt2,marginBottom:5 }}>Client (optional)</div>
            <select value={form.clientId} onChange={e=>setForm(p=>({...p,clientId:e.target.value}))} style={inputSt}>
              <option value="">No specific client</option>
              {clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}

          </div>
          <div>
            <div style={{ fontSize:12,color:C.txt2,marginBottom:5 }}>Routine run</div>
            <select value={form.routine} onChange={e=>setForm(p=>({...p,routine:e.target.value}))} style={inputSt}>
              <option value="">Select routine</option>
              {ROUTINES.map(r=><option key={r.id} value={r.id}>{r.label}</option>)}

          </div>
        </div>
        <div style={{ marginBottom:12 }}>
          <div style={{ fontSize:12,color:C.txt2,marginBottom:5 }}>Key findings (optional)</div>
          <textarea value={form.findings} onChange={e=>setForm(p=>({...p,findings:e.target.value}))} placeholder="e.g. Key theme surfaced, product signal, L2 update made..." rows={3} style={{ ...inputSt,resize:"vertical",fontFamily:mono,fontSize:12,lineHeight:1.75 }}/>
        </div>
        <button onClick={add} style={{ ...mkBtn(C.txt,C.surf3,C.bdr2,mob),width:"100%",padding:mob?"12px":"9px",fontSize:13 }}>Log</button>
      </div>

      {activityLog.length===0
        ?<div style={{ color:C.txt3,fontFamily:mono,fontSize:12,padding:"26px 0",lineHeight:2.2 }}>No entries yet.</div>
        :activityLog.map(entry=>{

          return <div key={entry.id} style={{ ...cardSt,marginBottom:8,display:"flex",gap:14,alignItems:"flex-start" }}>
            <div style={{ fontFamily:mono,fontSize:10,color:C.txt3,minWidth:58,paddingTop:2,flexShrink:0 }}>{fmtDate(entry.date)}</div>
            <div style={{ flex:1 }}>
              <div style={{ display:"flex",gap:8,alignItems:"center",marginBottom:4,flexWrap:"wrap" }}>
                <span style={{ fontSize:13,color:C.txt,fontWeight:500 }}>{rLabel}</span>
                {entry.clientName&&<span style={{ fontFamily:mono,fontSize:10,color:C.gold }}>· {entry.clientName}</span>}
              </div>
              {entry.findings&&<div style={{ fontSize:mob?13:11,color:C.txt2,lineHeight:1.75 }}>{entry.findings}</div>}
            </div>
          </div>;
        })}
    </div>
  );
}

// ─── Root ─────────────────────────────────────────────────────────────────────
function App() {
  const mob = useMobile();
  const [loading,setLoading]           = useState(true);
  const [initialized,setInitialized]   = useState(false);
  const [saveStatus,setSaveStatus]     = useState("idle");
  const [importStatus,setImportStatus] = useState(null);
  const [tab,setTab]                   = useState("command");
  const [clients,setClients]           = useState(DEFAULT_CLIENTS.map(norm));
  const [outreach,setOutreach]         = useState([]);
  const [activityLog,setActivityLog]   = useState([]);
  const [selRoutine,setSelRoutine]     = useState(null);
  const [selClientId,setSelClientId]   = useState("");
  const [fields,setFields]             = useState({});
  const saveTimer = useRef(null);
  const importRef = useRef(null);

  useEffect(()=>{
    const sc=LS.get("fi_clients"), so=LS.get("fi_outreach"), sl=LS.get("fi_log");
    if(sc&&Array.isArray(sc)) setClients(sc.map(norm));
    if(so&&Array.isArray(so)) setOutreach(so);
    if(sl&&Array.isArray(sl)) setActivityLog(sl);
    setInitialized(true);
    setLoading(false);
  },[]);

  useEffect(()=>{
    if(!initialized) return;
    clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(()=>{
      const ok=LS.set("fi_clients",clients)&&LS.set("fi_outreach",outreach)&&LS.set("fi_log",activityLog);
      setSaveStatus(ok?"saved":"error");
      if(ok) setTimeout(()=>setSaveStatus("idle"),2500);
    },400);
    return ()=>clearTimeout(saveTimer.current);
  },[clients,outreach,activityLog,initialized]);

  const handleExport=useCallback(()=>{
    const payload=JSON.stringify({version:2,exported:TODAY_STR,clients,outreach,activityLog},null,2);
    try{
      const blob=new Blob([payload],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url; a.download=`fi-coverage-${TODAY_STR}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    }catch{ navigator.clipboard.writeText(payload).catch(()=>{ console.log("FI_COVERAGE_EXPORT:",payload); }); }
  },[clients,outreach,activityLog]);

  const handleImportChange=useCallback((e)=>{
    const file=e.target.files?.[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.clients||!Array.isArray(data.clients)) throw new Error("Missing clients array");
        setClients(data.clients.map(norm));
        if(Array.isArray(data.outreach))    setOutreach(data.outreach);
        if(Array.isArray(data.activityLog)) setActivityLog(data.activityLog);
        setImportStatus({ok:true,msg:`✓ ${data.clients.length} clients, ${(data.outreach||[]).length} triggers`});
      }catch(err){ setImportStatus({ok:false,msg:`✗ Import failed: ${err.message}`}); }
    };
    reader.readAsText(file); e.target.value="";
  },[]);

  const updateL2   = (id) => setClients(prev=>prev.map(c=>c.id===id?{...c,l2Updated:TODAY_STR}:c));
  const openCount  = outreach.filter(t=>t.status==="open").length;
  const staleCount = clients.filter(c=>getHealth(c.l2Updated)==="stale").length;
  const driftCount = clients.filter(c=>getHealth(c.l2Updated)==="drifting").length;

  const TABS = [
    {id:"command",  lbl:"Command"},
    {id:"coverage", lbl:"Coverage"},
    {id:"launch",   lbl:"Launch"},
    {id:"pipeline", lbl:`Pipeline${openCount>0?` (${openCount})`:""}`},
    {id:"log",      lbl:"Log"},
  ];

  const saveDot = saveStatus==="saved"?{col:C.emL,lbl:"● SAVED"}:saveStatus==="error"?{col:C.burgL,lbl:"● ERR"}:null;

  if(loading) return (
    <div style={{ background:C.bg,height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:18 }}>
      <div style={{ fontFamily:serif,fontSize:20,color:C.gold,letterSpacing:"0.24em" }}>FI COV</div>
      <div style={{ fontFamily:mono,fontSize:10,color:C.txt3,letterSpacing:"0.12em" }}>LOADING</div>
    </div>
  );

  const sharedProps = { onExport:handleExport, onImportClick:()=>importRef.current?.click(), importRef, onImportChange:handleImportChange, importStatus };

  return (
    <div style={{ background:C.bg,minHeight:"100vh",color:C.txt }}>
      {/* Nav */}
      <div style={{ background:`linear-gradient(180deg,${C.surf2} 0%,${C.surf} 100%)`,borderBottom:`0.5px solid ${C.bdr2}`,position:"sticky",top:0,zIndex:100,overflowX:"auto" }}>
        <div style={{ display:"flex",alignItems:"center",padding:"0 14px",minWidth:"max-content" }}>
          <div style={{ fontFamily:serif,fontSize:mob?12:14,color:C.gold,letterSpacing:"0.20em",padding:`0 ${mob?12:18}px 0 0`,borderRight:`0.5px solid ${C.bdr2}`,lineHeight:mob?"50px":"48px",marginRight:mob?8:10,flexShrink:0 }}>
            {mob?"FIC":"FI COV"}
          </div>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{ background:"none",border:"none",cursor:"pointer",padding:`0 ${mob?10:15}px`,height:mob?50:48,fontFamily:sans,fontSize:mob?13:12,fontWeight:500,color:tab===t.id?C.gold:C.txt2,borderBottom:tab===t.id?`2px solid ${C.gold}`:"2px solid transparent",whiteSpace:"nowrap",flexShrink:0 }}>
              {t.lbl}
            </button>
          ))}
          <div style={{ marginLeft:"auto",fontFamily:mono,fontSize:9,display:"flex",gap:10,alignItems:"center",paddingLeft:12,flexShrink:0,letterSpacing:"0.07em" }}>
            {saveDot    &&<span style={{ color:saveDot.col }}>{saveDot.lbl}</span>}
            {staleCount>0&&<span style={{ color:C.burgL }}>●{staleCount}</span>}
            {driftCount>0&&<span style={{ color:C.cogL  }}>●{driftCount}</span>}
          </div>
        </div>
      </div>

      {/* Views */}
      <div style={{ paddingBottom:mob?24:0 }}>
        {tab==="command"  &&<CommandView  clients={clients} outreach={outreach} events={DEFAULT_EVENTS} setTab={setTab} setSelRoutine={setSelRoutine} setSelClientId={setSelClientId} setFields={setFields} updateL2={updateL2} {...sharedProps}/>}
        {tab==="coverage" &&<CoverageView clients={clients} setClients={setClients} setSelClientId={setSelClientId} setSelRoutine={setSelRoutine} setFields={setFields} setTab={setTab} updateL2={updateL2}/>}
        {tab==="launch"   &&<LaunchView   clients={clients} setClients={setClients} selRoutine={selRoutine} setSelRoutine={setSelRoutine} selClientId={selClientId} setSelClientId={setSelClientId} fields={fields} setFields={setFields} setActivityLog={setActivityLog} setOutreach={setOutreach}/>}
        {tab==="pipeline" &&<PipelineView clients={clients} outreach={outreach} setOutreach={setOutreach}/>}
        {tab==="log"      &&<LogView      clients={clients} activityLog={activityLog} setActivityLog={setActivityLog}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
